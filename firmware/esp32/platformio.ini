; ESP32 que liga e desliga o PC de casa (Sagyou, controle remoto).
; Contrato com o Worker: docs/esp32-api.md (raiz do repositório).

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Mostra no monitor serial o que o firmware imprime, com a hora local do PC.
monitor_filters = time
; Só a placa grava; os testes rodam no PC (env:native).
test_ignore = *

; Testes das regras (lib/power_rules) no PC, com o g++ local: `pio test -e native`.
; Rodam localmente por decisão do Luis (spec docs/specs/2026-11-07-esp32-firmware.md).
[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra

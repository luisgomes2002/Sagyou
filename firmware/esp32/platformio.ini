; ESP32 que liga e desliga o PC de casa (Sagyou, controle remoto).
; Contrato com o Worker: docs/esp32-api.md (raiz do repositório).

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Mostra no monitor serial o que o firmware imprime, com a hora local do PC.
monitor_filters = time

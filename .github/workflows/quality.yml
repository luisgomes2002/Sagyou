name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Vitest never loads better-sqlite3, so only this proves the postinstall
      # rebuilt it for Electron's ABI (otherwise `npm run dev` cannot open the DB).
      - name: better-sqlite3 loads inside Electron
        run: ELECTRON_RUN_AS_NODE=1 npx electron -e "require('better-sqlite3')(':memory:').close()"
      - run: npm run typecheck
      - run: npm run typecheck -w sagyou-sync-server
      - run: npm test
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: apps/desktop/coverage/
          if-no-files-found: warn
          retention-days: 14

  lint-changed:
    name: Lint changed lines
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject lint errors introduced by the pull request
        uses: reviewdog/action-eslint@6dad10dc50476699ad1ddbbb19bf55d36f311a39 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          eslint_flags: '.'
          reporter: github-pr-check
          filter_mode: diff_context
          fail_on_error: true

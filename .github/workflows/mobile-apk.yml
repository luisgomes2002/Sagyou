name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

# Builds and uploads the signed APK as an artifact. A mobile-v* tag also
# creates a draft Release with it, in a separate job: the only one that can
# write, and one that never sees the signing key or the code. A manual run
# never creates a Release.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The signing secrets live in this environment (Settings → Environments),
    # not at repository level, so a run from any branch cannot read them
    # unless the environment allows it.
    environment: mobile-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Fails before anything is built: the APK name and the Release come from the tag.
      - name: Tag matches app.json
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          tag="${GITHUB_REF_NAME#mobile-v}"
          app="$(node -p "require('./apps/mobile/app.json').expo.version")"
          [ "$tag" = "$app" ] || { echo "A tag mobile-v$tag não bate com a versão do app.json ($app)."; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # Electron's native rebuild and downloads are not needed for the phone.
      - run: npm ci --ignore-scripts
      # Firebase config for push (FCM). Optional: without the secret the APK is
      # built without notifications. Written outside the repository and never printed.
      - name: google-services.json from secrets
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          else
            echo "Sem o secret GOOGLE_SERVICES_JSON: o APK sai sem notificações."
          fi
      # Pinned template: the native project comes from a known version, not a dist-tag.
      - run: npx expo prebuild -p android --no-install --template expo-template-bare-minimum@58.0.31
        working-directory: apps/mobile
      # The template ships gradle-wrapper.jar, which runs with the keystore around.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Decoded only now: prebuild and the template never run with the key on disk.
      - name: Keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sagyou.jks"
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          SAGYOU_KEYSTORE_PATH: ${{ runner.temp }}/sagyou.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APK by version
        run: |
          v="$(node -p "require('./apps/mobile/app.json').expo.version")"
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk "sagyou-mobile-$v.apk"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sagyou.jks" "$RUNNER_TEMP/google-services.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sagyou-mobile-apk
          path: sagyou-mobile-*.apk
          if-no-files-found: error

  # Only the pull requests that changed the Android app or the shared core
  # since the previous mobile-v* tag (the desktop's v* releases come from the
  # same repository). No secrets and no write access here.
  notes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Notes with only the Android app's pull requests
        run: node apps/desktop/scripts/release-notes.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  release:
    needs: [apk, notes]
    # A manual run started on a tag also has refs/tags/… as its ref: only the tag push releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sagyou-mobile-apk
          path: apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: notes
      # Draft and never Latest: a person publishes it, and Latest belongs to the desktop.
      - name: Draft Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#mobile-v}"
          f="apk/sagyou-mobile-$v.apk"
          test -f "$f" || { echo "Falta $f"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "O release $GITHUB_REF_NAME já existe."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$f" --repo "$GITHUB_REPOSITORY" --draft --latest=false --title "Sagyou Android $v" --notes-file notes/release-notes.md
